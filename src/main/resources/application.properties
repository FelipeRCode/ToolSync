spring.application.name=toolsync
server.port=8080

# ------------------------------------------------------------------
# Banco de dados SQL Server
# O banco e criado pelo script banco/toolsync_banco.sql (o Hibernate NAO cria
# nem apaga tabelas: ddl-auto=none). Ajuste servidor/porta conforme a maquina.
#
# Maquina com autenticacao do Windows (padrao, igual ao projeto "prova"):
# instancia PRESSSTART\SQLEXPRESS01, porta TCP 50562 (troque pelo nome/porta da sua instancia)
spring.datasource.url=jdbc:sqlserver://PRESSSTART\\SQLEXPRESS01:50562;databaseName=ToolSync;encrypt=true;trustServerCertificate=true;integratedSecurity=true
#
# Laboratorio com usuario do SQL Server (comente a linha acima e use estas):
#spring.datasource.url=jdbc:sqlserver://localhost\\SQLEXPRESS:1433;databaseName=ToolSync;encrypt=true;trustServerCertificate=true
#spring.datasource.username=aluno
#spring.datasource.password=
# ------------------------------------------------------------------
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
# tabelas com o nome do @Table e colunas em snake_case (ex.: data_venda), como no script SQL
spring.jpa.hibernate.naming.physical-strategy=br.edu.fatecriopreto.toolsync.config.NomesBancoStrategy
spring.jpa.show-sql=false

# Sessao de login (cookie) expira apos 2 horas sem uso
server.servlet.session.timeout=2h
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
