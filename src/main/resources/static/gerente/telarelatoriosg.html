<!-- ==========================================================================
     ARQUIVO: telarelatoriosg.html
     DESCRIÇÃO: Tela de geração e visualização de relatórios gerenciais e métricas de desempenho.
     ========================================================================== -->
<!-- Declaração do tipo de documento HTML5 -->
<!DOCTYPE html>
<!-- Elemento raiz da página HTML definido em Português do Brasil -->
<html lang="pt-BR">
<!-- Cabeçalho técnico da página (metadados, título e importação de estilos) -->
<head>
    <!-- Define a codificação de caracteres como UTF-8 (suporte a acentos) -->
    <meta charset="UTF-8">
    <!-- Configura a responsividade para diferentes tamanhos de tela -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Define o título exibido na aba do navegador -->
    <title>ToolSync - Relatórios de Controle (Gerente)</title>
    <!-- Importa a folha de estilos CSS específica desta tela -->
    <link rel="stylesheet" href="telarelatoriosg.css">
    <!-- Importa a biblioteca externa de ícones Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<!-- Início do corpo visível da página -->
<body>
    <!-- Container principal que organiza o layout em barra lateral + área de conteúdo -->
    <div class="app-layout">
        <!-- Barra lateral fixa de navegação e identificação do usuário -->
        <aside class="sidebar">
            <!-- Logotipo e subtítulo do sistema ToolSync no topo da barra lateral -->
            <div class="brand">
                <h2>Tool<span class="orange">Sync</span></h2>
                <p>Sistema de Gestão de Ferramentas</p>
            </div>

            <!-- Bloco de exibição do avatar, nome e cargo do usuário logado -->
            <div class="user-profile">
                <div class="avatar-circle">
                    <i class="fa-solid fa-user"></i>
                </div>
                <h3 id="userNameDisplay">Carlos Silva</h3>
                <p id="userRoleDisplay">Gerente</p>
            </div>

            <nav class="nav-menu">
                <a href="telainicialg.html" class="nav-btn ">Dashboard</a>
                <a href="telacadastrog.html" class="nav-btn ">Cadastrar</a>
                <a href="telaestoqueg.html" class="nav-btn ">Estoque</a>
                <a href="telarelatoriosg.html" class="nav-btn active">Relatórios</a>
                <div class="nav-bottom">
                    <!-- Botão/link para encerrar a sessão e retornar à tela de login -->
                    <a href="../login.html" class="nav-btn logout-btn" id="btnLogout">Sair</a>
                </div>
            </nav>
        </aside>

        <main class="main-content animated-fadeIn">
            <!-- Botão de ação identificado por "btnGerarRelatorio" -->
            <button class="btn-top-save" id="btnGerarRelatorio">
                <i class="fa-solid fa-file-export"></i> Gerar Relatório
            </button>

            <h1 class="section-title">Relatórios</h1>

            <div class="filter-bar">
                <span>Pesquisar por:</span>
                <label>Vendedor:</label>
                <!-- Campo de entrada/seleção identificado por "filtroVendedor" -->
                <input type="text" id="filtroVendedor" placeholder="Nome do vendedor...">
                <label>Peça:</label>
                <!-- Campo de entrada/seleção identificado por "filtroPeca" -->
                <input type="text" id="filtroPeca" placeholder="Nome ou código da peça...">
                <label>Cliente:</label>
                <!-- Campo de entrada/seleção identificado por "filtroCliente" -->
                <input type="text" id="filtroCliente" placeholder="Nome do cliente...">
                <!-- Botão de ação identificado por "btnBuscarRelatorio" -->
                <button class="btn-buscar" id="btnBuscarRelatorio"><i class="fa-solid fa-magnifying-glass"></i> Pesquisar</button>
            </div>

            <div class="relatorio-resumo" id="resumoRelatorio">
                <span>Registros encontrados: <strong id="totalRegistros">0</strong></span>
                <span>Volume de itens: <strong id="totalItens">0</strong></span>
            </div>

            <div class="table-wrapper">
                <!-- Tabela estruturada para listagem e consulta de registros -->
                <table class="table-container">
                    <!-- Cabeçalho das colunas da tabela -->
                    <thead>
                        <tr>
                            <th>Código</th>
                            <th>Data</th>
                            <th>Vendedor</th>
                            <th>Cliente</th>
                            <th>Peça / Produto</th>
                            <th>Qtd.</th>
                            <th>Valor Total</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody id="tabelaRelatoriosBody">
                        <!-- Preenchido via JS -->
                    </tbody>
                </table>
            </div>

            <a href="telainicialg.html" class="btn-voltar-fixed">&larr; Voltar</a>
        </main>
    </div>
    <!-- Biblioteca compartilhada: API do back-end, sessão e lógica das telas -->
    <script src="../js/toolsync.js"></script>
    <!-- Importa o arquivo JavaScript responsável pela interatividade desta tela -->
    <script src="telarelatoriosg.js"></script>
</body>
</html>
