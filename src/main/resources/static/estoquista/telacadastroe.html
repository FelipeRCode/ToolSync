<!-- ==========================================================================
     ARQUIVO: telacadastroe.html
     DESCRIÇÃO: Menu intermediário de opções de cadastro disponíveis para o perfil Estoquista.
     ========================================================================== -->
<!-- Declaração do tipo de documento HTML5 -->
<!DOCTYPE html>
<!-- Elemento raiz da página HTML definido em Português do Brasil -->
<html lang="pt-BR">
<!-- Cabeçalho técnico da página (metadados, título e importação de estilos) -->
<head>
    <!-- Define a codificação de caracteres como UTF-8 (suporte a acentos) -->
    <meta charset="UTF-8">
    <!-- Configura a responsividade para diferentes tamanhos de tela -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Define o título exibido na aba do navegador -->
    <title>ToolSync - Cadastrar (Estoquista)</title>
    <!-- Importa a folha de estilos CSS específica desta tela -->
    <link rel="stylesheet" href="telacadastroe.css">
    <!-- Importa a biblioteca externa de ícones Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<!-- Início do corpo visível da página -->
<body>
    <!-- Container principal que organiza o layout em barra lateral + área de conteúdo -->
    <div class="app-layout">
        <!-- Sidebar Navigation -->
        <!-- Barra lateral fixa de navegação e identificação do usuário -->
        <aside class="sidebar">
            <!-- Logotipo e subtítulo do sistema ToolSync no topo da barra lateral -->
            <div class="brand">
                <h2>Tool<span class="orange">Sync</span></h2>
                <p>Sistema de Gestão de Ferramentas</p>
            </div>

            <!-- Bloco de exibição do avatar, nome e cargo do usuário logado -->
            <div class="user-profile">
                <div class="avatar-circle">
                    <i class="fa-solid fa-user"></i>
                </div>
                <h3 id="userNameDisplay">Pedro Henrique</h3>
                <p id="userRoleDisplay">Estoquista 01</p>
            </div>

            <nav class="nav-menu">
                <button class="nav-btn" onclick="window.location.href='telainiciale.html'">Dashboard</button>
                <button class="nav-btn active" onclick="window.location.href='telacadastroe.html'">Cadastrar</button>
                <button class="nav-btn" onclick="window.location.href='telaconsultarestoquee.html'">Estoque</button>

                <div class="nav-bottom">
                    <!-- Botão de ação identificado por "btnLogout" -->
                    <button class="nav-btn logout-btn" id="btnLogout">Sair</button>
                </div>
            </nav>
        </aside>

        <!-- Main Content Area -->
        <!-- Área principal à direita onde o conteúdo dinâmico da tela é exibido -->
        <main class="main-content">
            <div class="dashboard-header-bar">
                <span class="dashboard-title-tag">Cadastrar</span>
            </div>

            <div class="cadastro-panel">
                <div class="options-area">
                    <div class="option-card" onclick="window.location.href='telacadastrarprodutoe.html'">
                        <div class="option-icon">
                            <i class="fa-solid fa-screwdriver-wrench"></i>
                        </div>
                        <button class="option-label-btn">Cadastrar<br>Produto</button>
                    </div>
                </div>

                <div class="panel-footer">
                    <button class="btn-voltar" onclick="window.location.href='telainiciale.html'">
                        &larr; Voltar
                    </button>
                </div>
            </div>
        </main>
    </div>
    <!-- Biblioteca compartilhada: API do back-end, sessão e lógica das telas -->
    <script src="../js/toolsync.js"></script>
    <!-- Importa o arquivo JavaScript responsável pela interatividade desta tela -->
    <script src="telacadastroe.JS"></script>
</body>
</html>
